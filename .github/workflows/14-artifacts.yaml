name: 14 - Working with Artifacts

on: 
  workflow_dispatch

jobs: 
  
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyWorkflows/Reusable
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run tests
        run: |
          echo "Running tests..."
          ls -la 
          echo "Tests completed."

      - name: Upload test results as artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: MyWorkflows/Reusable/*
          retention-days: 1
      
      - name: List artifacts
        run: |
          echo "Listing artifacts..."
          ls -la 
          echo "Artifacts listed."

      - name: Download test results artifact
        uses: actions/download-artifact@v7
        with:
          name: test-results
      
      - name: Verify downloaded artifact
        run: |
          ls -lahR

